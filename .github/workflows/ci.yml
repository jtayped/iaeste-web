name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  # On a pull request, narrow every turbo task to the packages the branch
  # actually changed and the packages that depend on them. Appended to the
  # `npm run` calls below, where npm forwards it to turbo.
  #
  # Master pushes stay deliberately unfiltered. The merge commit's content is
  # what the pull request just validated, so the whole graph is a cache hit
  # and a full run costs seconds — which makes it free insurance against the
  # one thing an affected filter cannot catch, a package breaking without its
  # own files changing.
  TURBO_AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  # What `--affected` diffs against. Unset on a push, where turbo falls back
  # to its own default.
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}

jobs:
  verify:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    # @repo/db's repository suite runs against a real Postgres, never mocks
    # (see IA-11's acceptance criteria) — this service container is that
    # database for CI. IA-70 is where a fuller integration-test setup is
    # planned, but the tests already exist and already run in `npm run
    # test`, so this can't wait for IA-70 without leaving CI broken.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iaeste_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # Full history: `--affected` diffs against the base branch, which a
      # shallow clone would not contain.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Turborepo remote cache, backed by GitHub's own Actions cache rather
      # than Vercel's hosted service — no account or token to manage. The
      # action starts a local cache server and exports the TURBO_API /
      # TURBO_TOKEN / TURBO_TEAM that `turbo` looks for, so it has to run
      # before any npm script that shells out to turbo. With it, a change
      # confined to one workspace lets turbo skip lint/types/test/build for
      # every workspace that doesn't depend on it, instead of re-running all
      # of them from zero.
      - uses: rharkor/caching-for-turbo@v2.5.1

      # Cheapest checks first, so a formatting or typing mistake fails in
      # seconds rather than after the whole suite has run.
      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint -- $TURBO_AFFECTED

      - name: Types
        run: npm run check-types -- $TURBO_AFFECTED

      - name: Tests
        run: npm run test -- $TURBO_AFFECTED
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/iaeste_test

      # Catches a `.env.example` that has drifted from what the schemas in
      # @repo/env (and apps/api's own process.env reads) actually expect —
      # a stale or missing key here is exactly what IA-03's typed env config
      # is meant to prevent. Pure static check: no .env, database, or network
      # access needed.
      - name: .env.example matches the schemas
        run: npm run env:check

      # The OpenAPI document and the generated client are build outputs that
      # live in the tree. If regenerating them changes anything, the committed
      # copies are stale and the typed client is lying about the API.
      - name: Generated API client is current
        run: |
          npm run generate:api
          git diff --exit-code -- apps/api/openapi.json packages/api-client/src/generated

      # apps/cms owns an isolated database. Give CI a separate one so a future
      # Payload migration test never touches iaeste_test.
      - name: Create the CMS test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE iaeste_cms_test'

      # payload-types.ts and the admin import map are generated from the
      # Payload config. A stale committed copy means the types are lying.
      - name: Generated Payload output is current
        run: |
          npm run --workspace cms generate:types
          npm run --workspace cms generate:importmap
          git diff --exit-code -- apps/cms/src/payload-types.ts 'apps/cms/src/app/(payload)/admin/importMap.js'
        env:
          CMS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/iaeste_cms_test
          CMS_PAYLOAD_SECRET: ci-placeholder-ci-placeholder-000001
          CMS_PREVIEW_SECRET: ci-placeholder-ci-placeholder-000002
          WEB_REVALIDATE_SECRET: ci-placeholder-ci-placeholder-000003
          CMS_PUBLIC_ORIGIN: http://localhost:3006
          WEB_PUBLIC_ORIGIN: http://localhost:3000
          WEB_REVALIDATE_URL: http://localhost:3000/api/revalidate/blog
          CMS_MEDIA_DIR: /tmp/cms-media
          CMS_EMAIL_FROM: noreply@iaestelleida.cat
          RESEND_API_KEY: ci-placeholder

      # Config loads and the isolated database is reachable; when committed
      # Payload migrations exist this also proves they apply cleanly.
      - name: Payload migrations apply
        run: npm run --workspace cms migrate:status
        env:
          CMS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/iaeste_cms_test
          CMS_PAYLOAD_SECRET: ci-placeholder-ci-placeholder-000001
          CMS_PREVIEW_SECRET: ci-placeholder-ci-placeholder-000002
          WEB_REVALIDATE_SECRET: ci-placeholder-ci-placeholder-000003
          CMS_PUBLIC_ORIGIN: http://localhost:3006
          WEB_PUBLIC_ORIGIN: http://localhost:3000
          WEB_REVALIDATE_URL: http://localhost:3000/api/revalidate/blog
          CMS_MEDIA_DIR: /tmp/cms-media
          CMS_EMAIL_FROM: noreply@iaestelleida.cat
          RESEND_API_KEY: ci-placeholder

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # Full history: `--affected` diffs against the base branch, which a
      # shallow clone would not contain.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Turborepo remote cache, backed by GitHub's own Actions cache rather
      # than Vercel's hosted service — no account or token to manage. The
      # action starts a local cache server and exports the TURBO_API /
      # TURBO_TOKEN / TURBO_TEAM that `turbo` looks for, so it has to run
      # before any npm script that shells out to turbo. With it, a change
      # confined to one workspace lets turbo skip lint/types/test/build for
      # every workspace that doesn't depend on it, instead of re-running all
      # of them from zero.
      - uses: rharkor/caching-for-turbo@v2.5.1

      - name: Build all workspaces
        run: npm run build -- $TURBO_AFFECTED
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3004
          API_INTERNAL_URL: http://localhost:3004
          NEXT_PUBLIC_INSCRIPCIONS_STATE: "on"
          RESEND_API_KEY: ci-placeholder
          CONTACT_FORM_FROM: noreply@iaestelleida.cat
          CONTACT_FORM_TO: ci@example.com
          # apps/cms compiles @repo/env/cms/server while building; non-secret
          # placeholders only. Secrets over 32 chars satisfy the schema.
          CMS_DATABASE_URL: postgres://build:build@localhost:5432/build
          CMS_PAYLOAD_SECRET: ci-placeholder-ci-placeholder-000001
          CMS_PREVIEW_SECRET: ci-placeholder-ci-placeholder-000002
          WEB_REVALIDATE_SECRET: ci-placeholder-ci-placeholder-000003
          CMS_PUBLIC_ORIGIN: http://localhost:3006
          WEB_PUBLIC_ORIGIN: http://localhost:3000
          WEB_REVALIDATE_URL: http://localhost:3000/api/revalidate/blog
          CMS_MEDIA_DIR: /tmp/cms-media
          CMS_EMAIL_FROM: noreply@iaestelleida.cat

  # Which images this pull request is worth building, from the same turbo
  # dependency graph deploy.yml gates production on. Before this existed the
  # matrix below was static and every PR built all five, so an admin-only
  # change still rebuilt api, cms, web and inscripcions to prove nothing had
  # happened to them.
  detect-images:
    name: Select images
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      # Full history: the affected-apps query diffs against the base branch,
      # which a shallow clone would not contain.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Paths outside every workspace, which turbo's dependency graph
            # cannot reason about — a change here has to build all five.
            force_all:
              - '.github/scripts/**'
              - '.github/workflows/ci.yml'

      - name: Which apps does this pull request affect?
        id: affected
        run: node .github/scripts/affected-apps.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORCE_ALL: ${{ steps.filter.outputs.force_all }}

      # The same five entries the matrix used to hold, narrowed to the
      # affected apps. They are filtered here rather than by a job-level `if`
      # because that cannot read the matrix context, so an unaffected image
      # has to leave the matrix rather than skip inside the job.
      #
      # admin and cms carry no build args on purpose. apps/admin compiles no
      # NEXT_PUBLIC_* values into its bundle (next.config.ts reads
      # API_INTERNAL_URL at runtime), and apps/cms bakes its own non-secret
      # placeholders in its Dockerfile's builder stage, with Coolify supplying
      # the real runtime values.
      - name: Narrow the image matrix
        id: matrix
        env:
          AFFECTED: ${{ steps.affected.outputs.apps_json }}
        run: |
          images=$(cat <<'JSON'
          [
            { "name": "api", "file": "apps/api/Dockerfile", "build-args": "" },
            { "name": "inscripcions", "file": "apps/inscripcions/Dockerfile",
              "build-args": "NEXT_PUBLIC_API_URL=http://localhost:3004\nNEXT_PUBLIC_INSCRIPCIONS_STATE=on\nNEXT_PUBLIC_WHATSAPP_INVITE=https://chat.whatsapp.com/example" },
            { "name": "web", "file": "apps/web/Dockerfile",
              "build-args": "NEXT_PUBLIC_API_URL=http://localhost:3004\nRESEND_API_KEY=build-placeholder\nCONTACT_FORM_FROM=noreply@iaestelleida.cat\nCONTACT_FORM_TO=ci@example.com" },
            { "name": "admin", "file": "apps/admin/Dockerfile", "build-args": "" },
            { "name": "cms", "file": "apps/cms/Dockerfile", "build-args": "" }
          ]
          JSON
          )
          include=$(jq -c --argjson affected "$AFFECTED" \
            '[ .[] | select(.name as $n | $affected | index($n) != null) ]' <<<"$images")
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "Building: $(jq -r '[.[].name] | join(", ") | if . == "" then "nothing" else . end' <<<"$include")" >> "$GITHUB_STEP_SUMMARY"

  container-images:
    name: Build container images
    needs: detect-images
    # `include: []` is not a legal matrix, so the job has to be skipped
    # outright when a pull request touches no app at all.
    if: github.event_name == 'pull_request' && needs.detect-images.outputs.include != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Writing the layer cache to GHCR is a registry push, even though the
      # image itself is never pushed from a PR.
      packages: write
    # One job per image instead of five sequential steps: they build in
    # parallel, so this job's wall time is bounded by the slowest image
    # rather than the sum of all five. The cache ref matches deploy.yml's for
    # the same image exactly, on purpose — merging a PR should let the
    # production build reuse the cache this job just populated instead of
    # starting cold.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-images.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          build-args: ${{ matrix.build-args }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/iaeste-${{ matrix.name }}:buildcache
          # ignore-error: a pull request from a fork gets a read-only
          # GITHUB_TOKEN, so the cache export would fail and take an otherwise
          # green build down with it. Missing the write is the right outcome
          # there; failing the check is not.
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/iaeste-${{ matrix.name }}:buildcache,mode=max,image-manifest=true,ignore-error=true
