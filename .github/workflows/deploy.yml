name: Deploy

on:
  push:
    branches: [master]
    paths:
      - ".github/scripts/deploy-coolify.mjs"
      - ".github/workflows/deploy.yml"
      - "apps/admin/**"
      - "apps/api/**"
      - "apps/cms/**"
      - "apps/inscripcions/**"
      - "apps/web/**"
      - "packages/api-client/**"
      - "packages/constants/**"
      - "packages/db/**"
      - "packages/email/**"
      - "packages/env/**"
      - "packages/ui/**"
      - "tooling/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable image tag, such as sha-0123... (40 hex characters)
        required: true
        type: string
      target:
        description: Resource to roll back
        required: true
        default: all
        type: choice
        options:
          - all
          - api
          - admin
          - cms
          - inscripcions
          - web

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    name: Select images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      full: ${{ steps.filter.outputs.full }}
      # Not wired into any `if:` yet — see the note on the `affected` step.
      api: ${{ steps.affected.outputs.api }}
      admin: ${{ steps.affected.outputs.admin }}
      cms: ${{ steps.affected.outputs.cms }}
      inscripcions: ${{ steps.affected.outputs.inscripcions }}
      web: ${{ steps.affected.outputs.web }}
    steps:
      # Full history: the affected-apps query diffs against the commit this
      # push started from, which a shallow clone would not contain.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Paths outside every workspace, which turbo's dependency graph
            # cannot reason about — a change here has to mark all five apps.
            force_all:
              - '.github/scripts/deploy-coolify.mjs'
              - '.github/workflows/deploy.yml'
            full:
              - '.github/scripts/deploy-coolify.mjs'
              - '.github/workflows/deploy.yml'
              - 'apps/admin/**'
              - 'apps/api/**'
              - 'apps/cms/**'
              - 'apps/inscripcions/**'
              - 'apps/web/**'
              - 'packages/api-client/**'
              - 'packages/constants/**'
              - 'packages/db/**'
              - 'packages/email/**'
              - 'packages/env/**'
              - 'packages/ui/**'
              - 'tooling/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'

      # Dry run. This computes, per app, whether the push actually affects it,
      # using turbo's dependency graph instead of the flat `full` path glob
      # above — so a change confined to apps/web marks only web, while a change
      # to packages/ui marks every app that imports it.
      #
      # Nothing consumes these outputs yet. `full` still gates all ten
      # build/deploy jobs exactly as before, so this push behaves identically
      # to every push before it. The point is to log the booleans against real
      # commits first and confirm they match what a human would have picked,
      # because the failure mode of getting this wrong is not a slow deploy but
      # a silently skipped one. Once a handful of pushes of each shape look
      # right — one app, a shared package, the lockfile — a follow-up swaps the
      # `if:` conditions over and drops `full`.
      - name: Which apps does this push affect?
        id: affected
        run: node .github/scripts/affected-apps.mjs
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FORCE_ALL: ${{ steps.filter.outputs.force_all }}

  build-admin:
    name: Build and push iaeste-admin
    if: github.event_name == 'push' && needs.detect-changes.outputs.full == 'true'
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-admin
          tags: |
            type=raw,value=main
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            API_INTERNAL_URL=${{ vars.ADMIN_API_INTERNAL_URL || 'http://iaeste-api:3004' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-admin:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-admin:buildcache,mode=max,image-manifest=true

  build-cms:
    name: Build and push iaeste-cms
    if: github.event_name == 'push' && needs.detect-changes.outputs.full == 'true'
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-cms
          tags: |
            type=raw,value=main
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cms/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-cms:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-cms:buildcache,mode=max,image-manifest=true

  build-api:
    name: Build and push iaeste-api
    if: github.event_name == 'push' && needs.detect-changes.outputs.full == 'true'
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-api
          tags: |
            type=raw,value=main
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-api:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-api:buildcache,mode=max,image-manifest=true

  build-inscripcions:
    name: Build and push iaeste-inscripcions
    if: github.event_name == 'push' && needs.detect-changes.outputs.full == 'true'
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-inscripcions
          tags: |
            type=raw,value=main
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/inscripcions/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_INSCRIPCIONS_STATE=${{ vars.NEXT_PUBLIC_INSCRIPCIONS_STATE || 'on' }}
            NEXT_PUBLIC_WHATSAPP_INVITE=${{ vars.NEXT_PUBLIC_WHATSAPP_INVITE }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-inscripcions:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-inscripcions:buildcache,mode=max,image-manifest=true

  build-web:
    name: Build and push iaeste-web
    if: github.event_name == 'push' && needs.detect-changes.outputs.full == 'true'
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-web
          tags: |
            type=raw,value=main
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            RESEND_API_KEY=build-placeholder
            CONTACT_FORM_FROM=noreply@iaestelleida.cat
            CONTACT_FORM_TO=ci@example.com
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-web:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-web:buildcache,mode=max,image-manifest=true

  deploy-api:
    name: Deploy API first
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'push' && needs.detect-changes.outputs.full == 'true' && needs.build-api.result == 'success' &&
      needs.build-admin.result == 'success' && needs.build-cms.result == 'success' &&
      needs.build-inscripcions.result == 'success' && needs.build-web.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'api')))
    needs:
      [
        detect-changes,
        build-api,
        build-admin,
        build-cms,
        build-inscripcions,
        build-web,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and wait for health
        run: node .github/scripts/deploy-coolify.mjs
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_API_DEPLOY_WEBHOOK }}
          COOLIFY_HEALTH_URL: ${{ vars.COOLIFY_API_HEALTH_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ROLLBACK: ${{ github.event_name == 'workflow_dispatch' }}

  deploy-admin:
    name: Deploy admin
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'push' && needs.detect-changes.outputs.full == 'true' && needs.build-admin.result == 'success' &&
      needs.deploy-api.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'admin' ||
      (inputs.target == 'all' && needs.deploy-api.result == 'success'))))
    needs: [detect-changes, build-admin, deploy-api]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and wait for health
        run: node .github/scripts/deploy-coolify.mjs
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_ADMIN_DEPLOY_WEBHOOK }}
          COOLIFY_HEALTH_URL: ${{ vars.COOLIFY_ADMIN_HEALTH_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ROLLBACK: ${{ github.event_name == 'workflow_dispatch' }}

  deploy-inscripcions:
    name: Deploy inscripcions
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'push' && needs.detect-changes.outputs.full == 'true' && needs.build-inscripcions.result == 'success' &&
      needs.deploy-api.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'inscripcions' ||
      (inputs.target == 'all' && needs.deploy-api.result == 'success'))))
    needs: [detect-changes, build-inscripcions, deploy-api]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and wait for health
        run: node .github/scripts/deploy-coolify.mjs
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_INSCRIPCIONS_DEPLOY_WEBHOOK }}
          COOLIFY_HEALTH_URL: ${{ vars.COOLIFY_INSCRIPCIONS_HEALTH_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ROLLBACK: ${{ github.event_name == 'workflow_dispatch' }}

  deploy-cms:
    name: Deploy cms
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'push' && needs.detect-changes.outputs.full == 'true' && needs.build-cms.result == 'success' &&
      needs.deploy-api.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'cms' ||
      (inputs.target == 'all' && needs.deploy-api.result == 'success'))))
    needs: [detect-changes, build-cms, deploy-api]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # The CMS entrypoint runs `payload migrate` before it reports healthy, so
      # this step also waits on the isolated iaeste_cms migration.
      - name: Deploy and wait for health
        run: node .github/scripts/deploy-coolify.mjs
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_CMS_DEPLOY_WEBHOOK }}
          COOLIFY_HEALTH_URL: ${{ vars.COOLIFY_CMS_HEALTH_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ROLLBACK: ${{ github.event_name == 'workflow_dispatch' }}

  deploy-web:
    name: Deploy web
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'push' && needs.build-web.result == 'success' &&
      needs.deploy-api.result == 'success' && needs.deploy-cms.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'web' ||
      (inputs.target == 'all' && needs.deploy-api.result == 'success'))))
    needs: [detect-changes, build-web, deploy-api, deploy-cms]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and wait for health
        run: node .github/scripts/deploy-coolify.mjs
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_WEB_DEPLOY_WEBHOOK }}
          COOLIFY_HEALTH_URL: ${{ vars.COOLIFY_WEB_HEALTH_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ROLLBACK: ${{ github.event_name == 'workflow_dispatch' }}
