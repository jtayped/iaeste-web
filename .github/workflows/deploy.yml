name: Deploy

on:
  push:
    branches: [master]
    # Deliberately coarse. This list used to name each workspace one by one
    # and had already drifted — `packages/auth` was missing, so a change to it
    # alone never triggered a deploy even though apps/api depends on it. The
    # `detect-changes` job now works out which apps a push actually affects
    # from turbo's dependency graph, so this only has to be wide enough not to
    # miss anything; too wide costs one cheap job that then skips everything.
    paths:
      - ".github/scripts/**"
      - ".github/workflows/deploy.yml"
      - "apps/**"
      - "packages/**"
      - "tooling/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable image tag, such as sha-0123... (40 hex characters)
        required: true
        type: string
      target:
        description: Resource to roll back
        required: true
        default: all
        type: choice
        options:
          - all
          - api
          - admin
          - cms
          - inscripcions
          - web

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    name: Select images
    if: github.event_name == 'push'
    runs-on: ${{ vars.CI_RUNNER_PIN || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      api: ${{ steps.affected.outputs.api }}
      admin: ${{ steps.affected.outputs.admin }}
      cms: ${{ steps.affected.outputs.cms }}
      inscripcions: ${{ steps.affected.outputs.inscripcions }}
      web: ${{ steps.affected.outputs.web }}
    steps:
      # Full history: the affected-apps query diffs against the commit this
      # push started from, which a shallow clone would not contain.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Paths outside every workspace, which turbo's dependency graph
            # cannot reason about — a change here has to mark all five apps.
            force_all:
              - '.github/scripts/**'
              - '.github/workflows/deploy.yml'

      # Which apps this push actually affects, from turbo's dependency graph:
      # a change confined to apps/web marks only web, while a change to
      # packages/ui marks every app that imports it. Every build-* and deploy-*
      # job below gates on its own boolean from here, so an unaffected app is
      # neither rebuilt nor redeployed.
      #
      # Replayed over the 14 merges to master before this landed, 5 would have
      # narrowed, 2 of them to a single app.
      - name: Which apps does this push affect?
        id: affected
        run: node .github/scripts/affected-apps.mjs
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FORCE_ALL: ${{ steps.filter.outputs.force_all }}

  build-admin:
    name: Build and push iaeste-admin
    if: github.event_name == 'push' && needs.detect-changes.outputs.admin == 'true'
    needs: detect-changes
    runs-on: ${{ vars.CI_RUNNER_PIN || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-admin
          tags: |
            type=raw,value=main
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            API_INTERNAL_URL=${{ vars.ADMIN_API_INTERNAL_URL || 'http://iaeste-api:3004' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-admin:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-admin:buildcache,mode=max,image-manifest=true

  build-cms:
    name: Build and push iaeste-cms
    if: github.event_name == 'push' && needs.detect-changes.outputs.cms == 'true'
    needs: detect-changes
    runs-on: ${{ vars.CI_RUNNER_PIN || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-cms
          tags: |
            type=raw,value=main
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cms/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-cms:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-cms:buildcache,mode=max,image-manifest=true

  build-api:
    name: Build and push iaeste-api
    if: github.event_name == 'push' && needs.detect-changes.outputs.api == 'true'
    needs: detect-changes
    runs-on: ${{ vars.CI_RUNNER_PIN || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-api
          tags: |
            type=raw,value=main
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-api:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-api:buildcache,mode=max,image-manifest=true

  build-inscripcions:
    name: Build and push iaeste-inscripcions
    if: github.event_name == 'push' && needs.detect-changes.outputs.inscripcions == 'true'
    needs: detect-changes
    runs-on: ${{ vars.CI_RUNNER_PIN || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-inscripcions
          tags: |
            type=raw,value=main
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/inscripcions/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_INSCRIPCIONS_STATE=${{ vars.NEXT_PUBLIC_INSCRIPCIONS_STATE || 'on' }}
            NEXT_PUBLIC_WHATSAPP_INVITE=${{ vars.NEXT_PUBLIC_WHATSAPP_INVITE }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-inscripcions:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-inscripcions:buildcache,mode=max,image-manifest=true

  build-web:
    name: Build and push iaeste-web
    if: github.event_name == 'push' && needs.detect-changes.outputs.web == 'true'
    needs: detect-changes
    runs-on: ${{ vars.CI_RUNNER_PIN || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-web
          tags: |
            type=raw,value=main
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            RESEND_API_KEY=build-placeholder
            CONTACT_FORM_FROM=noreply@iaestelleida.cat
            CONTACT_FORM_TO=ci@example.com
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-web:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/iaeste-web:buildcache,mode=max,image-manifest=true

  # apps/api/docker-entrypoint.sh runs `node apps/api/dist/migrate.js` before
  # the server starts, so deploying the API is what applies the shared schema
  # migrations. That makes this a migration barrier, not a convention, and the
  # other four still wait on it.
  #
  # What changed with affected-only deploys is what counts as satisfied. A
  # `needs.deploy-api.result == 'success'` test would block web whenever api
  # was skipped for being unaffected — which is most pushes, and exactly the
  # case where there is no migration to wait for. `!contains(needs.*.result,
  # 'failure')` accepts a skipped dependency and still refuses a broken one,
  # so an unaffected api lets web through while a failed api stops everything.
  deploy-api:
    name: Deploy API first
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'push' && needs.detect-changes.outputs.api == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'api')))
    needs:
      [
        detect-changes,
        build-api,
        build-admin,
        build-cms,
        build-inscripcions,
        build-web,
      ]
    runs-on: ${{ vars.CI_RUNNER_PIN || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # the self-hosted runner image ships node 10.19.0 on PATH, and the
      # runner's own node24 sits under /actions-runner/externals where a
      # `run:` step cannot reach it. github-hosted runners preinstall a
      # current node, which is the only reason this ever worked.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy and wait for health
        run: node .github/scripts/deploy-coolify.mjs
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_API_DEPLOY_WEBHOOK }}
          COOLIFY_HEALTH_URL: ${{ vars.COOLIFY_API_HEALTH_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ROLLBACK: ${{ github.event_name == 'workflow_dispatch' }}

  deploy-admin:
    name: Deploy admin
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'push' && needs.detect-changes.outputs.admin == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'admin' ||
      (inputs.target == 'all' && needs.deploy-api.result == 'success'))))
    needs: [detect-changes, build-admin, deploy-api]
    runs-on: ${{ vars.CI_RUNNER_PIN || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # the self-hosted runner image ships node 10.19.0 on PATH, and the
      # runner's own node24 sits under /actions-runner/externals where a
      # `run:` step cannot reach it. github-hosted runners preinstall a
      # current node, which is the only reason this ever worked.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy and wait for health
        run: node .github/scripts/deploy-coolify.mjs
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_ADMIN_DEPLOY_WEBHOOK }}
          COOLIFY_HEALTH_URL: ${{ vars.COOLIFY_ADMIN_HEALTH_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ROLLBACK: ${{ github.event_name == 'workflow_dispatch' }}

  deploy-inscripcions:
    name: Deploy inscripcions
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'push' && needs.detect-changes.outputs.inscripcions == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'inscripcions' ||
      (inputs.target == 'all' && needs.deploy-api.result == 'success'))))
    needs: [detect-changes, build-inscripcions, deploy-api]
    runs-on: ${{ vars.CI_RUNNER_PIN || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # the self-hosted runner image ships node 10.19.0 on PATH, and the
      # runner's own node24 sits under /actions-runner/externals where a
      # `run:` step cannot reach it. github-hosted runners preinstall a
      # current node, which is the only reason this ever worked.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy and wait for health
        run: node .github/scripts/deploy-coolify.mjs
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_INSCRIPCIONS_DEPLOY_WEBHOOK }}
          COOLIFY_HEALTH_URL: ${{ vars.COOLIFY_INSCRIPCIONS_HEALTH_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ROLLBACK: ${{ github.event_name == 'workflow_dispatch' }}

  deploy-cms:
    name: Deploy cms
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'push' && needs.detect-changes.outputs.cms == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'cms' ||
      (inputs.target == 'all' && needs.deploy-api.result == 'success'))))
    needs: [detect-changes, build-cms, deploy-api]
    runs-on: ${{ vars.CI_RUNNER_PIN || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # The CMS entrypoint runs `payload migrate` before it reports healthy, so
      # this step also waits on the isolated iaeste_cms migration.
      # the self-hosted runner image ships node 10.19.0 on PATH, and the
      # runner's own node24 sits under /actions-runner/externals where a
      # `run:` step cannot reach it. github-hosted runners preinstall a
      # current node, which is the only reason this ever worked.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy and wait for health
        run: node .github/scripts/deploy-coolify.mjs
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_CMS_DEPLOY_WEBHOOK }}
          COOLIFY_HEALTH_URL: ${{ vars.COOLIFY_CMS_HEALTH_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ROLLBACK: ${{ github.event_name == 'workflow_dispatch' }}

  deploy-web:
    name: Deploy web
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'push' && needs.detect-changes.outputs.web == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'web' ||
      (inputs.target == 'all' && needs.deploy-api.result == 'success'))))
    needs: [detect-changes, build-web, deploy-api, deploy-cms]
    runs-on: ${{ vars.CI_RUNNER_PIN || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # the self-hosted runner image ships node 10.19.0 on PATH, and the
      # runner's own node24 sits under /actions-runner/externals where a
      # `run:` step cannot reach it. github-hosted runners preinstall a
      # current node, which is the only reason this ever worked.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy and wait for health
        run: node .github/scripts/deploy-coolify.mjs
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_WEB_DEPLOY_WEBHOOK }}
          COOLIFY_HEALTH_URL: ${{ vars.COOLIFY_WEB_HEALTH_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ROLLBACK: ${{ github.event_name == 'workflow_dispatch' }}
