name: Deploy

# Builds and pushes the apps/web container image to GHCR. Nothing else in
# this repo is containerized yet (see docs/deployment.md) -- inscripcions,
# admin and api are IA-60/IA-61, deliberately out of scope here.
#
# Pull requests only get as far as `verify` in ci.yml; this workflow never
# runs on a PR, so a fork or branch can't push an image to the registry.
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy.yml"
      - "apps/web/**"
      - "content/**"
      - "keystatic.config.ts"
      - "packages/constants/**"
      - "packages/email/**"
      - "packages/env/**"
      - "packages/ui/**"
      - "tooling/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/iaeste-web

jobs:
  build-and-push:
    name: Build and push apps/web image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # Build args are CI-safe placeholders/config, not secrets:
      # NEXT_PUBLIC_* values are compiled into the client bundle. Server-only
      # values here are placeholders; Coolify supplies the real values to the
      # running container. See apps/web/Dockerfile and docs/deployment.md.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_INSCRIPCIONS_STATE=on
            NEXT_PUBLIC_KEYSTATIC_GITHUB_APP_SLUG=${{ vars.NEXT_PUBLIC_KEYSTATIC_GITHUB_APP_SLUG }}
            RESEND_API_KEY=build-placeholder
            CONTACT_FORM_FROM=noreply@iaestelleida.cat
            CONTACT_FORM_TO=ci@example.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
